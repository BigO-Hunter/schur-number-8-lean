name: Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SchurNumber8 (S(8) >= 5372)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The Lean package lives in SchurNumber8/; the build re-emits the
      # #print axioms line for schur8_lower_5372.
      - name: Install Lean and cached Mathlib dependencies
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: SchurNumber8
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
